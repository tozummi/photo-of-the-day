<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Photo of the Day</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=DM+Sans:wght@500;600&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="widget">

    <article class="polaroid">

      <header class="polaroid-heading">
        <span class="eyebrow">Wiltshire Memories</span>
        <h1>Photo of the Day</h1>
      </header>

      <!-- CHANGE THIS IMAGE -->
      <img
        src="photo-of-the-day.jpg"
        alt="Family photo of the day"
        class="photo"
      >

      <!-- CHANGE THIS CAPTION -->
      <p class="caption">Making memories together ♡</p>

    </article>

  </main>
<script>
  function sendWidgetHeight() {
    const widget = document.querySelector(".widget");

    if (!widget) return;

    const height = Math.ceil(widget.getBoundingClientRect().height);

    window.parent.postMessage(
      {
        type: "photo-widget-height",
        height: height
      },
      "*"
    );
  }

  window.addEventListener("load", sendWidgetHeight);
  window.addEventListener("resize", sendWidgetHeight);

  const photo = document.querySelector(".photo");

  if (photo) {
    if (photo.complete) {
      sendWidgetHeight();
    }

    photo.addEventListener("load", sendWidgetHeight);
  }

  const widget = document.querySelector(".widget");

  if (widget && "ResizeObserver" in window) {
    new ResizeObserver(sendWidgetHeight).observe(widget);
  }
</script>
</body>
</html>
